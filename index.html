<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>چت دونفره</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0f1117;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh}.app{width:min(94vw,480px);height:min(90vh,700px);background:#181c25;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}.top{padding:18px;text-align:center;background:#222837}.setup{padding:22px}.setup input,.send input{width:100%;padding:13px;border:0;border-radius:12px;background:#2b3242;color:white;outline:0;margin-bottom:10px}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:#536dfe;color:white;font-weight:bold;cursor:pointer;margin-bottom:8px}.copy{background:#353d4e}.status{text-align:center;color:#aeb7c9;font-size:13px;margin-top:8px}.messages{display:none;flex:1;overflow:auto;padding:16px}.msg{width:max-content;max-width:80%;padding:10px 14px;margin:7px 0;border-radius:16px;background:#303747;word-break:break-word}.mine{margin-right:0;margin-left:auto;background:#536dfe}.send{display:none;padding:12px;background:#222837;gap:8px}.send input{margin:0}.send button{border:0;border-radius:12px;background:#536dfe;color:#fff;padding:0 16px}.room{font-size:12px;color:#9ca8bc;word-break:break-all;margin:8px 0}</style></head><body><div class="app"><div class="top">💬 چت دونفره<div id="status" class="status">یک اتاق بساز یا با کد وارد شو</div></div><div id="setup" class="setup"><input id="code" placeholder="کد اتاق را وارد کن"><button class="btn" id="create">ساخت اتاق جدید</button><button class="btn copy" id="join">ورود به اتاق</button><div id="room" class="room"></div></div><div id="messages" class="messages"></div><form id="send" class="send"><input id="text" placeholder="پیامت رو بنویس..." autocomplete="off"><button>ارسال</button></form></div><script>const $=id=>document.getElementById(id),status=$('status'),setup=$('setup'),messages=$('messages'),send=$('send'),code=$('code'),room=$('room');let peer,conn;function add(text,mine=false){const d=document.createElement('div');d.className='msg'+(mine?' mine':'');d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}function ready(c){conn=c;setup.style.display='none';messages.style.display='block';send.style.display='flex';status.textContent='🟢 متصل';c.on('data',x=>add(String(x)));c.on('close',()=>status.textContent='🔴 ارتباط قطع شد');send.onsubmit=e=>{e.preventDefault();const t=$('text').value.trim();if(t&&conn&&conn.open){conn.send(t);add(t,true);$('text').value=''}}}function startHost(id){peer=new Peer(id);peer.on('open',x=>{status.textContent='کد اتاق آماده است';room.textContent='کد: '+x;code.value=x;history.replaceState(null,'','?room='+x)});peer.on('connection',c=>{if(!conn)ready(c)});peer.on('error',e=>status.textContent='خطا: '+e.type)}$('create').onclick=()=>{const id=Math.random().toString(36).slice(2,8);startHost(id)};$('join').onclick=()=>{const id=code.value.trim();if(!id)return;peer=new Peer();peer.on('open',()=>{const c=peer.connect(id);c.on('open',()=>ready(c));c.on('error',()=>status.textContent='کد اتاق اشتباه است یا اتاق بسته شده');});peer.on('error',e=>status.textContent='خطا: '+e.type)};const q=new URLSearchParams(location.search).get('room');if(q){code.value=q;status.textContent='کد اتاق داخل لینک است؛ روی ورود بزن'}</script></body></html>
