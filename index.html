<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دو نفره</title><style>body{margin:0;font-family:Arial,sans-serif;background:#10131a;color:#fff;display:grid;place-items:center;height:100vh}.app{width:min(92vw,430px);height:80vh;background:#191e28;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 15px 50px #0008}.head{padding:18px;background:#222938;text-align:center;font-weight:bold}.messages{flex:1;padding:16px;overflow:auto}.msg{max-width:75%;padding:10px 14px;margin:8px 0;border-radius:16px;background:#303746}.me{margin-right:auto;background:#3b5ccc}.form{display:flex;padding:12px;background:#222938;gap:8px}.form input{flex:1;padding:12px;border:0;border-radius:12px;background:#303746;color:#fff;outline:0}.form button{border:0;border-radius:12px;padding:0 18px;background:#4d6fff;color:#fff;cursor:pointer}</style></head>
<body><div class="app"><div class="head">💬 چت دونفره</div><div id="messages" class="messages"></div><form class="form" id="form"><input id="input" placeholder="پیامت رو بنویس..." autocomplete="off"><button>ارسال</button></form></div><script>const box=document.querySelector('#messages'),form=document.querySelector('#form'),input=document.querySelector('#input');function add(t){const d=document.createElement('div');d.className='msg me';d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight}form.onsubmit=e=>{e.preventDefault();if(input.value.trim()){add(input.value.trim());input.value=''}};add('سلام 👋 این نسخه‌ی ساده‌ی چت آماده‌ست!');</script></body></html>
